name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore bridge-release.jks \
            -alias bridge \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass bridgepass123 -keypass bridgepass123 \
            -dname "CN=alldayPay Notif Bridge, OU=Dev, O=alldayPay, L=Cianjur, C=ID"

      - name: Build release APK
        env:
          KS_PATH: ${{ github.workspace }}/bridge-release.jks
          KS_PASS: bridgepass123
          KS_ALIAS: bridge
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notif-bridge-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: notif-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Save the keystore so future builds keep the SAME signature
      # (same signature = update APK langsung tanpa uninstall dulu).
      # Simpan file ini, terus masukin sebagai GitHub Secret
      # (KS_JKS base64) kalau mau signature permanen.
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: bridge-release.jks
